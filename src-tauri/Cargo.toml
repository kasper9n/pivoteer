[package]
name = "pivoteer"
version = "0.1.0"
description = "A Tauri App"
default-run = "pivoteer"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "1.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.1", features = ["clipboard-write-text", "dialog-open", "dialog-save", "shell-open", "window-close"] }
csv = "1.1"
bigdecimal = "0.3"
strum_macros = "0.24"
typescript-type-def = "0.5"
atomicwrites = "0.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24.0"
objc = "0.2.7"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
