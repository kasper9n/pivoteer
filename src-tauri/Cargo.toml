[package]
name = "pivoteer"
version = "0.1.0"
description = "A Tauri App"
default-run = "pivoteer"
edition = "2018"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "1.0.0-rc.11", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.0.0-rc.13", features = ["clipboard-write-text", "dialog-open", "dialog-save", "shell-open"] }
csv = "1.1.6"
bigdecimal = "0.3.0"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
