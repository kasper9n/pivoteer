[package]
name = "pivoteer"
version = "0.0.0"
edition = "2021"

[dependencies]
csv = "1.2"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = "0.4"
csv-pipeline = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
csv-core = "0.1"
rayon = "1.7"
anyhow = "1.0"
jsonc-parser = { version = "0.23", features = ["serde"] }
clap = { version = "4.3", features = ["derive"] }
maplit = "1.0"
dirs-next = "2.0"
pretty_assertions = "1.4"
numeric-sort = "0.1"

[profile.dev]
opt-level = 1
