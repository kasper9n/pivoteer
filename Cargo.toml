[package]
name = "pivoteer"
version = "0.0.0"
edition = "2021"

[dependencies]
csv = "1.1"
bigdecimal = { version = "0.3", features = ["serde"] }
chrono = "0.4"
csv-pipeline = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.7"
csv-core = "0.1"
rayon = "1.7"
anyhow = "1.0.71"
jsonc-parser = { version = "0.21.1", features = ["serde"] }
clap = { version = "4.3.0", features = ["derive"] }
maplit = "1.0.2"
dirs-next = "2.0.0"

[profile.dev]
opt-level = 1
