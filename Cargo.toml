[package]
name = "pivoteer"
version = "0.0.0"
edition = "2021"

[dependencies]
csv = "1.2"
# bigdecimal v0.4 bug: https://github.com/akubera/bigdecimal-rs/issues/113
bigdecimal = { version = "0.3", features = ["serde"] }
chrono = "0.4"
csv-pipeline = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
csv-core = "0.1"
rayon = "1.7"
anyhow = "1.0"
clap = { version = "4.3", features = ["derive"] }
maplit = "1.0"
dirs-next = "2.0"
pretty_assertions = "1.4"
numeric-sort = "0.1"
# deser_hjson shows error line/column numbers. other hjson/jsonc crates don't
deser-hjson = "2.2"

[profile.dev]
opt-level = 1
