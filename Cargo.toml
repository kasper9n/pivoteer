[package]
name = "pivoteer"
version = "0.0.0"
edition = "2021"

[dependencies]
csv = "1.1"
bigdecimal = "0.3"
chrono = "0.4"
csv-pipeline = { git = "https://github.com/probablykasper/csv-pipeline", version = "*" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.7"
regex = "1.7"
csv-core = "0.1"

[profile.dev]
opt-level = 1
